<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Jesse Marasigan</title>
    <style>
        @font-face {
            font-family: "product_sans";
            src: url(product-sans/ProductSansRegular.ttf);
        }
        @font-face {
            font-family: "product_sans_bold";
            src: url(product-sans/ProductSansBold.ttf);
        }

        body {
            background-color: white;
        }

        /*Setting Columns*/

        .leftcolumn {
            float: left;
            width: 50%;
        }

        .rightcolumn {
            float: left;
            width: 50%;
        }

        .subleftcolumn {
            float:left;
            width: 50%;
        }

        /*Navigation Bar*/

        .navBar {
            /*background: aquamarine;*/
            padding: 0px;
            margin: 10px;
            height: 50px;
        }
        .navBar a {
            font-family: product_sans;
            float: right;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            vertical-align: center;
            border-radius: 25px;
            background-color: #8c9c6a;
            text-decoration: none;
        }
        .navBar a:hover {
            background-color: gainsboro;
            color: black;
        }
        .navBar a.home {
            font-family: product_sans_bold;
            font-size: 120%;
            display: block;
            text-align: left;
            float:left;
            color: black;
            background-color: white;
            padding: 14px 16px;
        }

        /*Content Cards*/

        .contentCard {
            position: relative;
            border-radius: 20px;
            background: #8c9c6a;
            /*width: 50%;*/
            /*height: 50%;*/
            margin: 15px 15px;
        }

        .linkCard {
            position: relative;
            border-radius: 20px;
            background: white;
            /*width: 50%;*/
            /*height: 50%;*/
            margin: 15px 15px;
        }

        .birdpic {
            background-image: url(pictures/bird.jpg);
            background-size: cover;
        }

        .profilepic {
            background-image: url(pictures/jesse.jpg);
            background-size: cover;
        }

        .profilepic:hover {
            opacity: 0.5;
        }

        .pageCard {
            border-radius: 35px;
            background: gainsboro;
            padding: 10px 10px;
            height: 90%;

            font-family: product_sans_bold;
            color: white;
            /*font-size: 300%;*/
        }

        .cardText {
            position: absolute;
            bottom: 10px;
            left: 15px;
            font-family: product_sans_bold;
            color: white;
            font-size: 300%;
        }
    </style>
</head>
<body>
    <div class="navBar">
        <a class="home" href="https://jessemarasigan.github.io">Jesse Marasigan | Photography Portfolio</a>
        <a href="https://forms.gle/yAAdL3pL6L92ddUW9" target="_blank">Book Photoshoot</a>
    </div>

    <div class="pageCard">
        <div class="leftcolumn">
            <div class="contentCard birdpic" style="height: 50%">
                <div class="cardText">Gallery</div>
            </div>
            <div class="leftcolumn">
                <a href="https://www.instagram.com/marasigan.media/" target="_blank">
                    <div class="linkCard profilepic" style="height: 43%">
                        <div class="cardText" style="font-size: 250%">Instagram</div>
                    </div>
                </a>
            </div>
            <div class="rightcolumn">
                <div class="contentCard" style="height: 43%">
                    <div class="cardText" style="font-size: 250%">More</div>
                </div>
            </div>
        </div>
        <div class="rightcolumn">
            <div class="contentCard" style="height: 96%">

            </div>
        </div>
    </div>

</body>
</html>
